[project]
name = "audiolayer"
version = "0.1.0"
description = "Professional stand-alone engine for layered music generation."
dependencies = [
    "mido>=1.3.2",
    "numpy>=1.26.4",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
